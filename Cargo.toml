[package]
name = "rades"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "EUPL-1.2"
description = "AdES signature formats from the ETSI standards: CAdES, PAdES, XAdES, JAdES and ASiC"
repository = "https://github.com/sgomez/rades"
readme = "README.md"
include = ["/src", "/README.md", "/LICENSE", "/NOTICE", "/CHANGELOG.md"]
keywords = ["ades", "eidas", "signature", "etsi", "cades"]
categories = ["cryptography"]

[dependencies]
der = { version = "0.8", features = ["derive", "oid", "alloc", "pem"] }
sha2 = "0.11"
sha3 = "0.12.0"
x509-cert = { version = "0.3", default-features = false, features = ["pem"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[dev-dependencies]
ecdsa = { version = "0.17", features = ["algorithm", "der"] }
p256 = { version = "0.14", features = ["ecdsa"] }
p384 = { version = "0.14", features = ["ecdsa"] }
p521 = { version = "0.14", features = ["ecdsa", "pem"] }
proptest = "1.11.0"
rand_chacha = "0.3"
rsa = "0.9"
sha2_10 = { version = "0.10", package = "sha2" }
sha3 = "0.12.0"
sha3_10 = { version = "0.10", package = "sha3" }
