name: Deny

on:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [main]
    paths: ['Cargo.toml', 'Cargo.lock', 'deny.toml']
  pull_request:
    paths: ['Cargo.toml', 'Cargo.lock', 'deny.toml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny,just
      - run: just deny
